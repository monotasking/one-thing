# 旧 Vue 宿主的打包配置 —— 只给 `npm run vue:unpack` 用,撑到运行时统一第四步(退役 Vue)整批删。
# 其余一切(extraResources / asarUnpack / 三平台 target / buildResources)继承主配置;
# 唯一差别是产物目录:Vue 宿主是 electron-vite 打到 `out/`,主入口由这里的 `extraMetadata.main` 覆盖
# 根 package.json 的 `main`(那一格已经指向 React 壳)。
extends: ./electron-builder.yml
files:
  - out/**/*
  - package.json
  - "!**/{CHANGELOG.md,README.md,readme.md,LICENSE,license,License}"
  - "!**/*.{d.ts,map,ts.map}"
  - "!**/test{,s}/**"
  - "!**/.{eslint,prettier,github,vscode}*"
  - "!node_modules/onnxruntime-web"
  - "!node_modules/@fontsource-variable"
  - "!node_modules/lxgw-wenkai-webfont"
  - "!node_modules/lxgw-wenkai-screen-webfont"
extraMetadata:
  main: ./out/main/index.js
