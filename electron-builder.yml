appId: com.onething.app
productName: onething
# 这棵树里的原生模块**一块二进制同时喂两个运行时**,所以不重建:
#   node-pty / sherpa-onnx-node(+ 各平台包) / fsevents(macOS optional)
# 这些是 **N-API** 插件 —— N-API 是 ABI 稳定的 C 接口,不吃 V8 的内部 ABI,
# 同一份 .node 在 Node(server / CLI / vitest)与 Electron(桌面)下都能 dlopen。
# 重建对它们只是白烧一遍工具链,还会把 sherpa 的预编译平台包顶掉。
#
# **这句话不是靠注释成立的**:`npm run gate:native` 逐块二进制在系统 Node 与
# `ELECTRON_RUN_AS_NODE=1` 的 Electron 下各 require 一次,再用 `nm -u` 扫未定义
# 符号(出现 _v8 / node:: / node_module_register 即红)。加新原生依赖先过那道门。
# 2026-09-03 读数:node-pty / sherpa-onnx-darwin-arm64 两块在 Node ABI 127 与 Electron ABI 145 下全部加载成功。
# v8+node 内部符号 0。
#
# 第二条理由(与 N-API 无关,单独成立):这条链上的 node-abi 根本不认识 Electron 41。
# electron-builder@26.4.0 → @electron/rebuild@4.0.1 → node-abi@4.25.0,它的 electron
# 目标表最高只到 40.0.0-alpha.2,`getAbi('41.1.1','electron')` 直接抛
# "Could not detect abi"。**换回官方版本号并不能修好这一条** —— 实测 `41.1.1` 与
# 旧的 `41.1.1+wvcus` 一样抛。旧注释把这件事记成「castlabs 的版本号让 node-abi 解析
# 失败」,那是把「node-abi 太老」误写成「版本号不合法」;这一行的正确理由是上面那条
# N-API,node-abi 只是又一个不该走 rebuild 的原因。
#
# 2026-09-03 起 electron 换回官方 npm 包(41.1.1,内嵌 Node 24.14 / ABI 145 与
# castlabs 那份逐字相同),它在官方下载源里有,`electronDist: node_modules/electron/dist`
# 那条变通随之退役。
npmRebuild: false
directories:
  buildResources: build
  output: release
# 主入口 = React 壳(运行时统一第三步,2026-09-03):`main` 指 apps/desktop-react/dist-electron/main.cjs,
# 页面在 apps/desktop-react/dist/。Vue 宿主的旧产物 out/ 由 electron-builder.vue.yml 单独打,第四步删。
files:
  - apps/desktop-react/dist/**/*
  - apps/desktop-react/dist-electron/**/*
  - package.json
  # Exclude unnecessary files from node_modules
  - "!**/{CHANGELOG.md,README.md,readme.md,LICENSE,license,License}"
  - "!**/*.{d.ts,map,ts.map}"
  - "!**/test{,s}/**"
  - "!**/.{eslint,prettier,github,vscode}*"
  # 语义召回(检索重建 S7)的**运行时**不进桌面打包档 —— 09-05 编排者按
  # `docs/design/search-index-2026-09.md` §0 拍点癸' 的 (c) 落地的**保守缺省,待用户拍**。
  #
  # 事实(09-05 同机同一份构建产物、只换这几行,两趟 `electron-builder --dir` 的
  # `du -sh` 读数):`@huggingface/transformers` 48M,装它顺带把 `onnxruntime-node`
  # 212M / `onnxruntime-web` 92M / `sharp` 0.9M + `@img/*` 16M 拖进 node_modules。
  # **全打进去 `onething.app` 565M,按这几行排除掉是 309M**(差 256M;剩下的大头是
  # Electron Framework 本身 260M,那一份谁也去不掉)。
  # 而其中「不打反而更诚实」的一半是:嵌入器写死 `device: 'wasm'`,**只有
  # onnxruntime-web 那一份有用**,而它早在 S7 之前就被这里的一行排除了(旧注释写
  # 「主进程用不着」)—— 于是 S7 交卷那一刻打包档里躺着的是**用不上的 212M** 加
  # **唯独缺的那一份**:多背两百多兆,还是跑不起来。
  # `sharp` / `@img/*` 是 transformers 的图像分支,产品从不走(没有一处 `import 'sharp'`)。
  # (`@huggingface/jinja` 是纯 JS 的模板件、十几个文件,留着无害,没排。)
  #
  # 三条路,选定之后改的就是下面这几行(**没有人拍板之前一条都不选**):
  #  (a) 解包 onnxruntime-web 的 wasm(app 从 309M 涨到约 400M,换来打包档能跑语义召回);
  #  (b) 改用 onnxruntime-node(拍点癸 b,+212M;它是 N-API、已过 `gate:native`,
  #      但与癸 a 的「零原生」相反);
  #  (c) **今天这条** —— 语义召回只在 dev / server / CLI 上供应,桌面档不带运行时。
  # (c) 下打包 app 的行为由门钉死:`gate:packaged` ④-c 判 `search.status.vector === 'off'`
  # 且 `vectorExtension === 'loadable'`。开关就算被打开,`import('@huggingface/transformers')`
  # 抛 → `VectorWriter.markOff` 把 `status.vector` 钉成 `'off'` 并 **warn 一条**,
  # 词法路一个字不受影响(用例:`search/embedding/__tests__/missing-runtime.test.ts`)。
  - "!**/node_modules/@huggingface/transformers/**"
  - "!**/node_modules/onnxruntime-node/**"
  - "!**/node_modules/onnxruntime-web/**"
  - "!**/node_modules/onnxruntime-common/**"
  - "!**/node_modules/sharp/**"
  - "!**/node_modules/@img/**"

# Native sherpa-onnx addon and its dylibs must stay on disk (loaded via
# process dlopen; the darwin package already carries an @loader_path rpath).
asarUnpack:
  - "**/node_modules/sherpa-onnx-node/**"
  - "**/node_modules/sherpa-onnx-darwin-arm64/**"
  - "**/node_modules/sherpa-onnx-darwin-x64/**"
  - "**/node_modules/sherpa-onnx-linux-x64/**"
  - "**/node_modules/sherpa-onnx-linux-arm64/**"
  - "**/node_modules/sherpa-onnx-win-x64/**"
  # node-pty ships a native addon plus a `spawn-helper` binary it execs; neither
  # can be loaded or run from inside the asar archive.
  - "**/node_modules/node-pty/**"
  # macOS workspace watcher: keep its optional runtime package and relative
  # N-API addon together on disk. Other platforms do not install/load it.
  - "**/node_modules/fsevents/**"
  # dist-electron 整个目录解包(第④步批 2b,2026-10-07 实测改回):
  #  · 检索索引 Worker(检索重建 S3b):`new Worker(path)` 走 Node 的模块加载,不是 Electron 补丁过的 asar fs 路;
  #  · ACP 宿主工具面的 stdio 桥(ACP A4-a)与不带界面的后端进程 `backend.cjs`(第④步批 2a / 2b):都被当成
  #    `ELECTRON_RUN_AS_NODE=1` 的子进程起,那条 node 没有 asar 补丁,读不到 asar 里的入口;
  #    装配层先找 `app.asar.unpacked/` 那一份(`packages/backend/acp/acp-mcp-bridge-path.ts`)。
  #
  # 为什么不是逐个单文件:electron-builder 26.4 的流式归档在「单文件 unpack」上有 header / 写入流不一致的坑
  # (09-06/07 那轮第一次撞到,工单 4 B3 当时改回单文件)。10-07 再次复现:单文件规则从两条加到三条
  # (加 `backend.cjs`)之后,`bun run gate:packaged` 在 ③ 报「app 提前退出 code=1」、stdout / stderr 全空、
  # 临时 store 一个文件都没写 —— asar header 把 `main.cjs` 记成 `unpacked: true`,`app.asar.unpacked/` 里却
  # 没有它;header 里 `package.json` 的 offset 指到一段 TextMate 语法 JSON 上(内容与 integrity 对不上)。
  # Electron 读不出入口就以 1 静默退出。复现:三条单文件规则 + `bun run build:unpack`,再用
  # `@electron/asar` 的 `extractFile(app.asar, 'package.json')` 看内容。整目录解包没有这个问题;
  # 代价是 `main.cjs` / `preload.cjs` 也在 asar 外(签名姿态:它们是 JS,不是 Mach-O,签名覆盖不变)。
  # 能不能起来由 `gate:packaged` 跑出来,不靠这段注释成立。
  - "apps/desktop-react/dist-electron/**"
  # 语义召回的 SQLite 扩展(检索重建 S7)。两条理由都要解包:
  #  ① `loadExtension` 走的是系统的 dlopen,asar 里那条路径它打不开;
  #  ② macOS 硬化运行时下**未签名的 dylib 装载会失败**,而 electron-builder 只对
  #     解包出来的 Mach-O 签名。
  # 这两句由门证,不靠这段注释:`gate:native` 判它在两个运行时下装得上,
  # `gate:packaged` 判打包 app 起来后 `search.status().vectorExtension === 'loadable'`
  # (**开关关着也要答得出** —— 等用户去设置里打开才发现漏了解包就晚了)。
  - "**/node_modules/sqlite-vec/**"
  - "**/node_modules/sqlite-vec-darwin-arm64/**"
  - "**/node_modules/sqlite-vec-darwin-x64/**"
  - "**/node_modules/sqlite-vec-linux-x64/**"
  - "**/node_modules/sqlite-vec-linux-arm64/**"
  - "**/node_modules/sqlite-vec-windows-x64/**"

# Extra resources to include (copied to resources/ in the app bundle)
extraResources:
  - from: resources/templates
    to: templates
    filter:
      - "**/*"
  - from: resources/docs
    to: docs
    filter:
      - "**/*"
  - from: resources/skills
    to: skills
    filter:
      - "**/*"
  # ACP agent 种子(A1-a):一台 agent 一个 JSON,名册从这里读(与 skills 同一条搬运规则)。
  - from: resources/acp-agents
    to: acp-agents
    filter:
      - "**/*"
  - from: resources/models
    to: models
    filter:
      - "**/*"

win:
  target:
    - nsis
    - portable

mac:
  extendInfo:
    NSMicrophoneUsageDescription: onething uses the microphone only when Voice is enabled or when you click the microphone button.
  target:
    - dmg
    - zip

linux:
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
