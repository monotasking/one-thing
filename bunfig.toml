# bun 1.3 对带 workspaces 的仓缺省用「隔离式」安装布局(pnpm 式:包进 node_modules/.bun,
# 根目录只放根 package.json 的直接依赖,workspace 包只链进各自成员的 node_modules)。
# 本仓所有解析按 npm 的「提升式」布局写:@onething/{core,runtime,backend,gateway} 必须链在
# 根 node_modules/@onething/ 下,apps/desktop-react 与 apps/web 不是 workspace 成员,靠向上
# 解析拿到它们与全部依赖。2026-09-03 用户 `bun install` 后 React 壳 esbuild 报
# 「Could not resolve @onething/backend/...」就是这一条。钉死 hoisted,和 package-lock 同形。
[install]
linker = "hoisted"
