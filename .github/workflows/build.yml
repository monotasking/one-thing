name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify release source
    # A local reusable workflow runs from this tag's commit, including its
    # full tests, platform persistence checks and architecture gates.
    uses: ./.github/workflows/test.yml

  build:
    name: Build on ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Extract version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Set package version from tag
        shell: bash
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${{ env.VERSION }}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "package.json version set to: $(node -p "require('./package.json').version")"

      - name: Install dependencies
        run: bun install

      - name: Install desktop dependencies
        working-directory: apps/desktop-react
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

      - name: Build application
        # 必须走 scripts/run-electron-builder.mjs,不能直接 bunx electron-builder。
        # 本仓库 bun.lock 与 package-lock.json 并存,electron-builder 26.x 于是退到
        # 环境变量判定包管理器,而 bunx 带进 npm_config_user_agent=bun → 选中
        # BunNodeModulesCollector。那个采集器会漏掉传递依赖(实测收了 cross-spawn
        # 却丢掉它的 which / shebang-command),打出来的 asar 一开就
        # "Cannot find module 'which'"。包装脚本抹掉包管理器指纹强制走 npm 采集器,
        # 并在打包前拿真实 prod 闭包做完整性预检,缺一个就让构建红掉。
        run: bun run build && node scripts/run-electron-builder.mjs --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macos-latest 是 arm64 runner,只有 7GB 内存,Node 据此把 old-space 定在
          # ~2GB —— v1.1.7 的 renderer 打包正好撞上去(FATAL: Ineffective
          # mark-compacts near heap limit,死在 2043MB)。Linux/Windows runner 有
          # 16GB,默认堆更大,所以只有 mac 挂。显式抬到 4GB,三个平台一视同仁。
          NODE_OPTIONS: --max-old-space-size=4096

      - name: List release artifacts
        shell: bash
        run: ls -lah release/ || echo "No release directory"

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-windows
          path: |
            release/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD)
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/${{ github.ref_name }}-macos/*
            artifacts/${{ github.ref_name }}-windows/*
            artifacts/${{ github.ref_name }}-linux/*
          body: |
            ## Release ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Description |
            |----------|------|-------------|
            | macOS | `.dmg` | Disk image installer |
            | macOS | `.zip` | Portable application |
            | Windows | `.exe` | NSIS installer |
            | Linux | `.AppImage` | Universal Linux package |
            | Linux | `.deb` | Debian/Ubuntu package |

            ### Changes

            ${{ steps.changelog.outputs.changelog }}

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/.../${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
