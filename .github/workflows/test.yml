name: Test

on:
  workflow_call:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Mobile's pure reducer/SSE tests are part of the root Node suite. Its Expo
      # tsconfig belongs to the standalone mobile package, outside the workspaces.
      - name: Install mobile test dependencies
        working-directory: apps/mobile
        run: bun install --frozen-lockfile

      - name: Install desktop and web test dependencies
        working-directory: apps/desktop-react
        run: bun install --frozen-lockfile

      # node-pty 是 N-API 插件,一份 .node 同时喂 Node 与 Electron —— 没有 ABI 要对,
      # `npm rebuild node-pty` 只是白烧一遍工具链,而且它顶撞仓库顶上那条
      # 「原生模块只许 N-API,且不许靠注释证明 ABI」的律(工单 4 D4 删)。
      # 真要证 ABI 走 `bun run gate:native`,它把每个 .node 在两个运行时下各加载一次。
      - name: Prepare native terminal tests
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ripgrep

      - name: Run tests
        run: bun run test

      - name: Run desktop and web renderer tests
        run: npm --prefix apps/desktop-react test

  # Native filesystem behavior must pass on every supported desktop platform.
  # A green local macOS run does not substitute for the Windows/NTFS runner.
  #
  # **先观察一轮,不挡任何东西**(2026-09-07,工单 4 D4):这套矩阵从来没在
  # Windows / Linux 上真跑过 —— 一次都没有。没跑过的门第一次上线时红的多半是
  # 门自己(路径分隔符、fsync 语义、临时目录权限),而 `build.yml` 的 tag 发布链
  # 通过 `workflow_call` 把整个 test.yml 拉进去当前置,于是它一红就是**发不了版**。
  # `continue-on-error: true` 让它照跑照报,但不拦 PR、也不拦发布。
  # 摘掉这一行的条件:三平台各连绿一轮,并在这里写上那一轮的日期。
  persistence:
    name: Persistence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check journal, blob, lifecycle and store lease durability
        run: >-
          bun run test
          packages/backend/session/__tests__/session-event-log.test.ts
          packages/backend/session/__tests__/event-log-checkpoint.test.ts
          packages/backend/session/__tests__/event-log-s1.test.ts
          packages/backend/session/__tests__/event-log-store-pinning.test.ts
          packages/backend/session/__tests__/event-write-failure.test.ts
          packages/backend/session/__tests__/shutdown-flush-and-blob-gc.test.ts
          packages/backend/session/__tests__/event-log-store-lifecycle.test.ts
          packages/backend/session/__tests__/event-log-blob-checkpoint.test.ts
          packages/backend/collab/kernel/__tests__/mailbox-failure.test.ts
          packages/backend/__tests__/collab-mailbox-failure-lifecycle.test.ts
          packages/backend/storage/__tests__/storage-store-lock.test.ts
          packages/backend/storage/__tests__/storage-durable-json.test.ts
          packages/backend/storage/__tests__/storage-store-backup.test.ts
          packages/backend/storage/__tests__/store-backup-crash.test.ts
          packages/backend/__tests__/store-backup-activation.test.ts
          packages/backend/session/__tests__/session-deletion-recovery.test.ts
          packages/backend/session/__tests__/session-storage-driver.test.ts
          packages/backend/session/__tests__/session-repository.test.ts
          packages/backend/http-server/__tests__/http-server-runtime-session-crash-recovery.test.ts

  # 结构门禁(docs/design/structural-debt-plan-2026-08.md §2 P0.5):五道棘轮只在有人手动跑时
  # 才说话,transport 门红了两天无人理。进 CI 后任一红则 PR 红。
  # sessions:verify:gate 依赖本机 store,不在这里跑。
  gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 两道陌生能力演练(provider:drill / feature:drill)在临时 worktree 里跑 tsc 与 vitest,
      # 要与 test job 同一个 Node 大版本(engines.node >= 22.13);别的门只用到 node 的基本面。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: boundary:gate
        run: bun run boundary:gate

      - name: assembly:gate
        run: bun run assembly:gate

      - name: transport:gate
        run: bun run transport:gate

      - name: provider:gate
        run: bun run provider:gate

      - name: entry:gate
        run: bun run entry:gate

      - name: name:gate
        run: bun run name:gate

      - name: cohesion:gate
        run: bun run cohesion:gate && node scripts/file-cohesion-gate.mjs --self-test && node scripts/split-prove.mjs --self-test

      - name: cycle:gate
        run: bun run cycle:gate

      - name: client-api:gate
        run: bun run client-api:gate

      - name: layer:gate
        run: bun run layer:gate

      - name: feature-map:check
        run: bun run feature-map:check

      # 陌生能力演练(CLAUDE.md 顶上「加功能不许改骨架」):在 HEAD 的临时 worktree 里各加一个虚构的
      # 服务商 / 功能,断言目录外只动了名册那几行、typecheck 与结构门全绿、演练测试经通用代码调得到它。
      - name: provider:drill
        run: bun run provider:drill

      - name: feature:drill
        run: bun run feature:drill

      - name: Renderer UI boundary gate
        run: npm --prefix apps/desktop-react run ui:consume

      - name: log:gate
        run: bun run log:gate

      - name: session:gate
        run: bun run session:gate

      # 第④步批 0「凭证归后端」:主密钥、safeStorage 迁移、口令导出导入、锁定与重试。只用 node、
      # `file` 档、临时 store;钥匙串那一档用假的 security 脚本,不碰任何真钥匙串。
      - name: gate:credentials
        run: bun run gate:credentials

      # 第④步批 2a「后端进程能独当一面」:不带界面的后端进程的桌面档(定时任务 / 真 MCP / 电台 / 首启模型拉取 /
      # 登录 shell PATH、owner `backend`、SIGTERM 收尾)与缺省档对照。CI 上只跑系统 Node 那一半(`--runtimes=node`):
      # Linux 机器上 Electron 二进制 + ELECTRON_RUN_AS_NODE 起不起得来没人证过,那一半在本机跑。临时 store、`file` 档。
      - name: gate:backend-process
        run: node scripts/gate-backend-process.mjs --build --runtimes=node

      # 第④步批 3「CLI 走 HTTP」:真 CLI 产物对真后端产物(`dist/server`,`build:cli` 一起出):依附一台活后端逐条跑
      # session / ask(假服务商)/ resource / mcp(stdio 握手,审计账上主体是 system:mcp:*);没有后端时缺省档报错、
      # `--spawn` 拉得起、`backend status|stop|start` 与旧名 `daemon`;别人的后端(server:start / 桌面档)`backend stop` 被拒。
      # 只用 node、临时 store、`file` 档,不开窗。
      - name: gate:cli-http
        run: node scripts/gate-cli-http.mjs --build
