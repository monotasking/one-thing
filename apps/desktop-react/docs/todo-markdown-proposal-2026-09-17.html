<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>待办 markdown 编辑(2026-09-17 样例)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* 值逐格抄自 src/styles/palette.css + tokens.css(阅读轴默认档「标准 14 · 舒适」) */
  :root {
    --surface-0: #f5f4f1; --surface-1: #faf9f7; --surface-2: #ffffff;
    --text-1: #2b2a26; --text-2: #5f5d56; --text-3: #78756d; --text-4: #b7b4ac;
    --line-1: #e6e4de; --line-2: #d3d0c8; --accent: #7c6fa0; --accent-deep: #655887; --ok: #6f8f4e;
    --st-hover: rgba(43, 42, 38, 0.06); --st-sel: rgba(124, 111, 160, 0.1);
    --font-ui: 'Schibsted Grotesk', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --r-1: 6px; --r-2: 10px; --r-3: 14px; --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --fs-meta: 12px; --fs-micro: 11px; --fs-code: 12.5px; --indent-1: 26px; --indent-2: 42px;
    --quote-pad: 26px; --quote-mark: 26px; --quote-lift: -2px;
    --pr-fs: 14px; --pr-lh: 1.6; --pr-gap: 0.7em; --pr-h2-top: 1.43em; --pr-h2-btm: 0.55em;
    --pr-h3-top: 1.15em; --pr-h3-btm: 0.43em; --pr-li: 0.28em; --pr-obj: 0.85em;
    --dur: 120ms; --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--text-1); font: 14px/1.6 var(--font-ui); padding: 28px 24px 60px; }
  button { font: inherit; color: inherit; }
  .page { max-width: 1160px; margin: 0 auto; }
  h1.pt { font-size: 20px; margin: 0 0 6px; }
  .lede { color: var(--text-2); max-width: 860px; margin: 0 0 14px; }
  .lede code, .note code { font-family: var(--font-mono); font-size: 12.5px; background: var(--st-hover); border-radius: var(--r-1); padding: 0 4px; }
  .cands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 14px; }
  @media (max-width: 960px) { .cands { grid-template-columns: repeat(2, 1fr); } }
  .cand { text-align: left; background: var(--surface-2); border: 1px solid var(--line-1); border-radius: var(--r-3); padding: 10px 12px; cursor: pointer; font-size: 13px; color: var(--text-2); }
  .cand:hover { border-color: var(--line-2); }
  .cand.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--st-sel); }
  .cand b { display: block; color: var(--text-1); font-size: 14px; margin-bottom: 2px; }
  .cand .rec { color: var(--accent-deep); font-size: 12px; font-weight: 600; margin-left: 4px; }
  .cand .meta { display: block; margin-top: 6px; font-size: 12px; color: var(--text-3); }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 10px; font-size: 13px; color: var(--text-3); }
  .pill { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 999px; padding: 3px 12px; cursor: pointer; color: var(--text-2); }
  .pill:hover { color: var(--text-1); }
  .pill.on { background: var(--text-1); color: var(--surface-2); border-color: var(--text-1); }
  .grid { display: grid; grid-template-columns: 1fr 380px; gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .host { background: var(--surface-2); border: 1px solid var(--line-1); border-radius: var(--r-3); overflow: hidden; margin: 0 auto; transition: max-width 200ms var(--ease); }
  .host.drawer { max-width: 640px; } .host.panel { max-width: 340px; }
  .hosthead { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line-1); background: var(--surface-1); font-size: 12px; color: var(--text-3); }
  .hosthead .sp { flex: 1; }
  .ghost { border: 0; background: none; color: var(--text-3); cursor: pointer; border-radius: var(--r-1); padding: 2px 8px; font-size: 12px; }
  .ghost:hover { background: var(--st-hover); color: var(--text-1); }
  .ghost.on { color: var(--accent-deep); }
  .docwrap { padding: 14px 18px 12px; max-height: 620px; overflow: auto; }
  .note { font-size: 12.5px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line-1); border-radius: var(--r-3); padding: 10px 14px; margin-top: 12px; }
  .note b { color: var(--text-1); }
  .note ul { margin: 4px 0 0; padding-left: 1.2em; } .note li { margin: 2px 0; }
  .kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface-2); color: var(--text-2); }

  /* ── 原文面板 ─────────────────────────────────── */
  .raw { background: var(--surface-2); border: 1px solid var(--line-1); border-radius: var(--r-3); overflow: hidden; position: sticky; top: 12px; }
  .raw .head { padding: 8px 12px; border-bottom: 1px solid var(--line-1); background: var(--surface-1); font-size: 12px; color: var(--text-3); display: flex; gap: 8px; }
  .raw .head .sp { flex: 1; }
  .raw .body { font: 11.5px/1.7 var(--font-mono); max-height: 640px; overflow: auto; padding: 6px 0; }
  .rl { display: flex; white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 10px 0 0; }
  .rl .n { flex: none; width: 34px; text-align: right; padding-right: 10px; color: var(--text-4); user-select: none; }
  .rl.chg { background: rgba(111, 143, 78, 0.12); }
  .rl.chg .n { color: var(--ok); }

  /* ════ 消息的 markdown 样式(逐条镜像 content/blocks/kinds/*.module.css)════ */
  .flow { font-size: var(--pr-fs); line-height: var(--pr-lh); color: var(--text-1); }
  .flow > * { margin-block: 0; }
  .flow > * + * { margin-block-start: var(--pr-gap); }
  .flow > [data-prose='h1'] + *, .flow > [data-prose='h2'] + * { margin-block-start: var(--pr-h2-btm); }
  .flow > [data-prose='h3'] + * { margin-block-start: var(--pr-h3-btm); }
  .flow > * + [data-prose='h1'], .flow > * + [data-prose='h2'] { margin-block-start: var(--pr-h2-top); }
  .flow > * + [data-prose='h3'] { margin-block-start: var(--pr-h3-top); }
  .flow > [data-prose='object'] + *, .flow > * + [data-prose='object'] { margin-block-start: var(--pr-obj); }
  .flow > :first-child { margin-block-start: 0 !important; }
  .h1, .h2, .h3 { color: var(--text-1); line-height: 1.4; overflow-wrap: anywhere; }
  .h1 { font-size: calc(var(--pr-fs) + 4px); font-weight: 650; }
  .h2 { font-size: calc(var(--pr-fs) + 2px); font-weight: 620; }
  .h3 { font-size: var(--pr-fs); font-weight: 600; }
  .p { white-space: pre-wrap; overflow-wrap: anywhere; }
  .list { padding-inline-start: var(--indent-2); margin-inline: 0; }
  ul.list { list-style: disc outside; } ol.list { list-style: decimal outside; }
  .li { white-space: pre-wrap; overflow-wrap: anywhere; position: relative; }
  .li + .li { margin-block-start: var(--pr-li); }
  .li::marker { color: var(--text-4); }
  .ic { font-family: var(--font-mono); font-size: var(--fs-code); padding: 0 var(--sp-1); border-radius: var(--r-1); background: var(--st-hover); }
  .lk { color: var(--accent-deep); text-decoration: underline; text-underline-offset: 2px; }
  .quote { position: relative; margin-inline: 0; padding-inline-start: var(--quote-pad); color: var(--text-2); }
  .quote::before { content: '\201C'; position: absolute; inset-inline-start: 0; top: var(--quote-lift); font-size: var(--quote-mark); line-height: 1; font-weight: 700; color: var(--line-2); }
  .quote .p { margin: 0; }
  .blk { display: flex; flex-direction: column; border: 1px solid var(--line-1); border-radius: var(--r-2); background: var(--surface-2); overflow: hidden; }
  .blk .eave { display: flex; align-items: center; gap: var(--sp-3); padding: 5px var(--sp-3); border-bottom: 1px solid var(--line-1); background: var(--surface-1); font: 11px/1.6 var(--font-mono); color: var(--text-3); }
  .blk .eave .sp { flex: 1; }
  .blk pre { margin: 0; padding: var(--sp-2) var(--sp-3); font: var(--fs-code)/1.6 var(--font-mono); color: var(--text-1); white-space: pre; overflow-x: auto; }

  /* ── 新增:任务项(消息里只读,待办里可点)─────────── */
  .li.task { list-style: none; }
  .cb { position: absolute; left: -22px; top: calc((var(--pr-lh) * 1em - 15px) / 2); width: 15px; height: 15px; padding: 0; border: 1.5px solid var(--text-4); border-radius: 4px; background: var(--surface-2); cursor: pointer; display: grid; place-items: center; transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
  .cb:hover { border-color: var(--text-2); }
  .cb svg { width: 9px; height: 9px; opacity: 0; }
  .li.done > .cb { background: var(--ok); border-color: var(--ok); }
  .li.done > .cb svg { opacity: 1; }
  .li.done > .c:not(.ew) { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--line-2); }

  /* ── 可编辑的通用态 ─────────────────────────────── */
  .u { border-radius: var(--r-1); cursor: text; }
  .editable .u:not(.act):hover { background: var(--st-hover); box-shadow: 0 0 0 3px var(--st-hover); }
  .li .c { border-radius: 3px; }
  .add { display: block; border: 0; background: none; cursor: pointer; color: var(--text-4); padding: 2px 0 2px var(--indent-2); margin-top: var(--pr-li); font-size: var(--pr-fs); line-height: var(--pr-lh); position: relative; text-align: left; width: 100%; }
  .add::before { content: '+'; position: absolute; left: calc(var(--indent-2) - 20px); }
  .add:hover { color: var(--text-2); }

  /* A:行内实时预览 —— 镜像层 + 透明输入框,同一种字 */
  .ew { position: relative; }
  .ew pre.hl { margin: 0; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1lh; }
  .ew textarea { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; outline: none; resize: none; overflow: hidden; background: transparent; color: transparent; caret-color: var(--text-1); font: inherit; line-height: inherit; letter-spacing: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ew textarea::selection { background: var(--st-sel); color: transparent; }
  .act { background: var(--surface-1); box-shadow: 0 0 0 3px var(--surface-1), 0 0 0 4px var(--line-1); border-radius: 3px; }
  .mk { color: var(--text-4); }
  .hic { background: var(--st-hover); border-radius: 3px; }
  .hlk { color: var(--accent-deep); }
  .hurl { color: var(--text-4); }
  .ew.mono { font: var(--fs-code)/1.6 var(--font-mono); }
  .ew.mono pre.hl, .ew.mono textarea { white-space: pre; overflow-wrap: normal; }
  .blk.act { box-shadow: 0 0 0 3px var(--st-sel); border-color: var(--accent); }
  .blk .ew { padding: var(--sp-2) var(--sp-3); }

  /* D:块级源码框 */
  .srcbox { display: block; width: 100%; margin: 0; resize: none; overflow: hidden; border: 1px solid var(--accent); box-shadow: 0 0 0 3px var(--st-sel); border-radius: var(--r-2); background: var(--surface-1); padding: 6px 9px; font: var(--fs-code)/1.6 var(--font-mono); color: var(--text-1); outline: none; white-space: pre-wrap; }
  .li > .srcbox { margin-left: -22px; width: calc(100% + 22px); }
  .srchint { font-size: 11px; color: var(--text-3); margin-top: 3px; }

  /* B:所见即所得 */
  .editable [contenteditable] { outline: none; }
  .wys [contenteditable]:focus { background: var(--surface-1); box-shadow: 0 0 0 3px var(--surface-1), 0 0 0 4px var(--line-1); border-radius: 3px; }
  .blk pre[contenteditable]:focus { box-shadow: none; }

  /* C:整篇源码 */
  .fullsrc { border: 1px solid var(--line-1); border-radius: var(--r-2); background: var(--surface-1); padding: 10px 12px; }
  .srcbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--text-3); }
  .srcbar .sp { flex: 1; }
  .btn { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: var(--r-2); padding: 2px 10px; cursor: pointer; font-size: 12px; }
  .btn.pri { background: var(--text-1); color: var(--surface-2); border-color: var(--text-1); }
</style>
</head>
<body>
<div class="page">
  <h1 class="pt">待办里的 markdown · 四种编辑方式</h1>
  <p class="lede">不在编辑的时候，四台画出来的字<b>和消息里完全一样</b>：标题的三级字号、列表的间距、行内码的小底、链接色、大引号引用、带檐的代码卡，数字全抄自壳里的块组件。区别只在「点进去改」的那一刻长什么样。右边是文件原文，你改了哪几行，那几行会变绿。<br>
  顺带发现一个缺口：消息今天会把 <code>- [ ]</code> 的勾选状态丢掉（画成普通圆点），嵌套列表也会被拍平成同一层。所以不管选哪台，<b>任务项要进消息的块组件</b>：消息里只读，待办里能点。</p>

  <div class="cands" id="cands">
    <button class="cand" data-cand="A"><b>A · 行内实时预览<span class="rec">推荐</span></b>点哪一行，只有那一行露出 markdown 记号（淡灰），勾选框、圆点、字号都不变；离开这一行马上恢复成渲染样子。<span class="meta">像 Obsidian / Typora。只改动过的那几行，其余字节不动。</span></button>
    <button class="cand" data-cand="B"><b>B · 所见即所得</b>永远看不到记号。直接在渲染好的字上改；<span class="kbd">⌘B</span> 加粗、<span class="kbd">⌘E</span> 行内码，行首敲 <code>[] </code>、<code>## </code>、<code>- </code> 自动变成任务、标题、列表。<span class="meta">像 Notion。改过的那一块会被重新写成标准写法（看右边原文）。</span></button>
    <button class="cand" data-cand="C"><b>C · 阅读 / 源码两态</b>平时是只读的渲染样子，只能勾选；点「编辑源码」整篇变成等宽源码框，改完回来。<span class="meta">最省事，但改一个字也要切一次。</span></button>
    <button class="cand" data-cand="D"><b>D · 块级源码框</b>点哪一块，那一块变成一个等宽的源码小框（含 <code>- [ ]</code> 前缀），其余照旧渲染。<span class="meta">渲染可以直接复用消息的块组件，实现最简单；编辑时看起来比较「技术」。</span></button>
  </div>

  <div class="bar">
    <span>放在</span>
    <button class="pill" data-width="drawer">输入框上方的抽屉（宽）</button>
    <button class="pill" data-width="panel">Dock 面板（窄）</button>
    <span style="width:14px"></span>
    <button class="pill" data-act="reset">重置</button>
  </div>

  <div class="grid">
    <div>
      <div class="host" id="host">
        <div class="hosthead"><span id="hosttitle"></span><span class="sp"></span><span id="hostaction"></span></div>
        <div class="docwrap"><div id="doc"></div></div>
      </div>
      <div class="note" id="note"></div>
    </div>
    <div class="raw">
      <div class="head"><span>ai-todo.md（原文）</span><span class="sp"></span><span id="chgcount"></span></div>
      <div class="body" id="raw"></div>
    </div>
  </div>
</div>

<script>
const ORIGINAL = `# 实现自动化部署脚本

服务器访问不了 GitHub，改走 \`git archive\` + \`scp\`，详见[部署文档](https://example.com/deploy)。

## 待修 bug
- [x] 服务器端 \`git rev-parse\` 拿 HASH 必失败 → **本地算好**再传过去
- [x] 旧版本清理方向反了
  - [x] 按 \`CreatedAt\` 排序
  - [ ] 只保留最近 *3* 个版本
- [ ] 健康检查改成 127.0.0.1 + 重试轮询

## 步骤
1. 重写 Makefile 的三个 target
2. 真机跑一遍 \`make deploy\`

* 用星号写的列表项，里面有 __下划线粗体__

> 回滚不要动线上内容，先用同一个版本冒烟。

\`\`\`bash
make rollback HASH=2aea22e2
\`\`\`

- [ ] 群里汇报`;

const NOTES = {
  A: `<b>怎么试：</b>点任意一行的字。<ul>
    <li><span class="kbd">↵</span> 在下面新起一项（任务接着是任务、编号自动 +1）；空项上再按 <span class="kbd">↵</span> 结束列表</li>
    <li>空项上 <span class="kbd">⌫</span> 删掉这一项，回到上一项</li>
    <li><span class="kbd">↑</span> <span class="kbd">↓</span> 在行首 / 行尾时跳到上一块 / 下一块；<span class="kbd">Tab</span> / <span class="kbd">⇧Tab</span> 缩进</li>
    <li><span class="kbd">Esc</span> 放弃这次修改；点别处就保存</li>
    <li>段落里敲 <code>## </code> 或 <code>- [ ] </code> 开头，离开时自动变成标题 / 任务</li></ul>
    <b>实现：</b>不在编辑的块直接用消息的块组件画；正在编辑的那一行是「高亮镜像层 + 透明输入框」，不需要引入编辑器库。代码块编辑时整块变等宽。<br>
    <b>代价：</b>编辑那一行时，粗体、行内码只能靠淡灰记号和底色表示，字不会变粗、不会变等宽（两层要逐字对齐）。`,
  B: `<b>怎么试：</b>直接点字改。<span class="kbd">⌘B</span> 加粗、<span class="kbd">⌘E</span> 行内码；在一段的开头敲 <code>[] </code> / <code>- </code> / <code>## </code> 会立刻变形；列表里 <span class="kbd">↵</span> 新起一项、空项 <span class="kbd">⌫</span> 删除。<br>
    试一下改「用星号写的列表项」那一行，看右边原文：<code>*</code> 被改成 <code>-</code>，<code>__</code> 被改成 <code>**</code>。<br>
    <b>代价：</b>要把渲染结果再翻回 markdown，用户（或 AI）原来的写法会被统一掉；真做通常要引入 ProseMirror 这类编辑器，自己再写一套和消息一样的样式。AI 也在按行改同一个文件，重写一块会增加撞车的机会。`,
  C: `<b>怎么试：</b>勾选框直接点；要改字点右上「编辑源码」，<span class="kbd">⌘↵</span> 完成、<span class="kbd">Esc</span> 取消。<br>
    <b>实现：</b>阅读态就是消息的渲染，源码态是一个带高亮的等宽输入框，改动最少。<br>
    <b>代价：</b>待办最常见的动作是「加一项、改一项的字」，每次都要切整篇源码，太重。`,
  D: `<b>怎么试：</b>点任意一块。列表里 <span class="kbd">↵</span> 新起一项、空项 <span class="kbd">⌫</span> 删除、<span class="kbd">↑</span><span class="kbd">↓</span> 跳块、<span class="kbd">Tab</span> 缩进、<span class="kbd">Esc</span> 放弃、点别处保存。<br>
    <b>实现：</b>最简单：渲染完全复用消息的块组件，编辑就是一个普通输入框装着那一块的原文。<br>
    <b>代价：</b>一点进去就看到 <code>- [ ] </code> 这种前缀和等宽字，版式会跳一下，看起来像在改代码。`,
};

const CHECK = '<svg viewBox="0 0 10 10"><path d="M1.8 5.2 4 7.3 8.2 2.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TITLES = { A: '行内实时预览', B: '所见即所得', C: '阅读 / 源码两态', D: '块级源码框' };

let S;
function reset() {
  S = { cand: S ? S.cand : 'A', width: S ? S.width : 'drawer', src: ORIGINAL, active: null, sourceMode: false };
}
reset();
const lines = () => S.src.split('\n');
const setLines = L => { S.src = L.join('\n'); };
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ── 解析:行 → 可编辑单元 ─────────────────────────────── */
const RE = {
  fence: /^```(\S*)\s*$/,
  heading: /^(#{1,6})\s+(.*)$/,
  task: /^(\s*)([-*+])\s+\[( |x|X)\]\s?(.*)$/,
  bullet: /^(\s*)([-*+])\s+(.*)$/,
  ordered: /^(\s*)(\d+)\.\s+(.*)$/,
  quote: /^>\s?(.*)$/,
};
function isStart(l) { return RE.fence.test(l) || RE.heading.test(l) || RE.bullet.test(l) || RE.ordered.test(l) || RE.quote.test(l); }
function parse(L) {
  const units = []; let i = 0;
  while (i < L.length) {
    const l = L[i]; let m;
    if (!l.trim()) { i++; continue; }
    if ((m = l.match(RE.fence))) {
      let j = i + 1; while (j < L.length && !/^```\s*$/.test(L[j])) j++;
      units.push({ type: 'code', start: i, end: Math.min(j, L.length - 1), lang: m[1] || 'text', body: L.slice(i + 1, j).join('\n') });
      i = j + 1; continue;
    }
    if ((m = l.match(RE.heading))) { units.push({ type: 'heading', start: i, end: i, level: Math.min(3, m[1].length), content: m[2] }); i++; continue; }
    if ((m = l.match(RE.task))) { units.push({ type: 'task', list: 'ul', start: i, end: i, indent: m[1].length, bullet: m[2], done: m[3] !== ' ', content: m[4] }); i++; continue; }
    if ((m = l.match(RE.bullet))) { units.push({ type: 'bullet', list: 'ul', start: i, end: i, indent: m[1].length, bullet: m[2], content: m[3] }); i++; continue; }
    if ((m = l.match(RE.ordered))) { units.push({ type: 'ordered', list: 'ol', start: i, end: i, indent: m[1].length, num: +m[2], content: m[3] }); i++; continue; }
    if (RE.quote.test(l)) { let j = i; const c = []; while (j < L.length && RE.quote.test(L[j])) { c.push(L[j].match(RE.quote)[1]); j++; } units.push({ type: 'quote', start: i, end: j - 1, content: c.join('\n') }); i = j; continue; }
    let j = i; const c = []; while (j < L.length && L[j].trim() && (j === i || !isStart(L[j]))) { c.push(L[j]); j++; }
    units.push({ type: 'para', start: i, end: j - 1, content: c.join('\n') }); i = j;
  }
  return units;
}
const isList = u => u.type === 'task' || u.type === 'bullet' || u.type === 'ordered';
function prefixOf(u) {
  const ind = ' '.repeat(u.indent || 0);
  if (u.type === 'task') return `${ind}${u.bullet} [${u.done ? 'x' : ' '}] `;
  if (u.type === 'bullet') return `${ind}${u.bullet} `;
  if (u.type === 'ordered') return `${ind}${u.num}. `;
  return '';
}
function unitSource(u) { return lines().slice(u.start, u.end + 1).join('\n'); }

/* ── 行内渲染(镜像 InlineRun:码 / 链接 / 粗 / 斜 / 删)─────── */
function inline(md) {
  const parts = md.split(/(`[^`]*`)/);
  return parts.map(p => {
    if (/^`[^`]*`$/.test(p)) return `<code class="ic">${esc(p.slice(1, -1))}</code>`;
    let h = esc(p);
    h = h.replace(/\[([^\]]*)\]\(([^)]*)\)/g, (_, t, u) => `<a class="lk" href="${u}" data-href="${u}">${t}</a>`);
    h = h.replace(/(\*\*|__)(.+?)\1/g, '<strong>$2</strong>');
    h = h.replace(/(^|[^*\w])([*_])([^*_\s][^*_]*?)\2(?![*\w])/g, '$1<em>$2</em>'.replace('$2</em>', '$3</em>'));
    h = h.replace(/~~(.+?)~~/g, '<del>$1</del>');
    return h;
  }).join('');
}
/* ── 源码高亮(只换颜色,不换字宽,好让镜像层与输入框逐字对齐)─── */
function hlInline(md) {
  return md.split(/(`[^`]*`)/).map(p => {
    if (/^`[^`]*`$/.test(p)) return `<span class="mk">\`</span><span class="hic">${esc(p.slice(1, -1))}</span><span class="mk">\`</span>`;
    let h = esc(p);
    h = h.replace(/\[([^\]]*)\]\(([^)]*)\)/g, '<span class="mk">[</span><span class="hlk">$1</span><span class="mk">](</span><span class="hurl">$2</span><span class="mk">)</span>');
    h = h.replace(/(\*\*|__|~~)/g, '<span class="mk">$1</span>');
    h = h.replace(/(^|[^*\w>])([*_])(?=\S)/g, '$1<span class="mk">$2</span>');
    return h;
  }).join('');
}
function hlSourceLine(l) {
  let m;
  if (RE.fence.test(l) || /^```/.test(l)) return `<span class="mk">${esc(l)}</span>`;
  if ((m = l.match(RE.heading))) return `<span class="mk">${m[1]} </span>${hlInline(m[2])}`;
  if ((m = l.match(/^(\s*[-*+]\s+\[[ xX]\]\s?|\s*[-*+]\s+|\s*\d+\.\s+|>\s?)(.*)$/))) return `<span class="mk">${esc(m[1])}</span>${hlInline(m[2])}`;
  return hlInline(l);
}
const hlBlock = (text, fenced) => text.split('\n').map(l => fenced ? esc(l) : hlSourceLine(l)).join('\n') + (text.endsWith('\n') ? ' ' : '');

/* ── 渲染 ───────────────────────────────────────────── */
const docEl = document.getElementById('doc');
function render(focusReq) {
  document.querySelectorAll('[data-cand]').forEach(b => b.classList.toggle('on', b.dataset.cand === S.cand));
  document.querySelectorAll('[data-width]').forEach(b => b.classList.toggle('on', b.dataset.width === S.width));
  document.getElementById('host').className = 'host ' + S.width;
  document.getElementById('hosttitle').textContent = `${S.width === 'drawer' ? '计划抽屉' : '我的清单面板'} · ${TITLES[S.cand]}`;
  document.getElementById('hostaction').innerHTML = S.cand === 'C' && !S.sourceMode ? '<button class="ghost" data-act="src">编辑源码</button>' : '';
  document.getElementById('note').innerHTML = NOTES[S.cand];

  if (S.cand === 'C' && S.sourceMode) {
    docEl.innerHTML = `<div class="fullsrc"><div class="srcbar"><span>整篇源码</span><span class="sp"></span><button class="btn" data-act="src-cancel">取消 Esc</button><button class="btn pri" data-act="src-done">完成 ⌘↵</button></div>
      <div class="ew mono" style="font-size:12.5px"><pre class="hl">${hlBlock(S.srcDraft)}</pre><textarea spellcheck="false" data-full>${esc(S.srcDraft)}</textarea></div></div>`;
    renderRaw();
    const ta = docEl.querySelector('textarea'); ta.focus(); ta.setSelectionRange(0, 0);
    return;
  }

  const units = parse(lines());
  const out = [];
  let k = 0;
  const editable = S.cand !== 'C';
  while (k < units.length) {
    const u = units[k];
    if (isList(u)) {
      const tag = u.list; const items = [];
      while (k < units.length && isList(units[k]) && units[k].list === tag) { items.push(renderLi(units[k])); k++; }
      out.push(`<${tag} class="list" data-prose="text">${items.join('')}</${tag}>`);
      continue;
    }
    out.push(renderUnit(u)); k++;
  }
  if (editable) out.push(`<button class="add" data-act="add">添加一项</button>`);
  docEl.innerHTML = `<div class="flow ${editable ? 'editable' : ''} ${S.cand === 'B' ? 'wys' : ''}">${out.join('')}</div>`;
  renderRaw();
  syncEditors();
  if (focusReq) applyFocus(focusReq);
}

function isActive(u) { return S.active && S.active.start === u.start && (S.cand === 'A' || S.cand === 'D'); }
const CE = () => S.cand === 'B' ? ' contenteditable="true" spellcheck="false"' : '';

function renderLi(u) {
  const act = isActive(u);
  const cls = `li u ${u.type === 'task' ? 'task' : ''} ${u.done ? 'done' : ''} ${act ? 'act' : ''}`;
  const style = u.indent ? ` style="margin-left:${Math.floor(u.indent / 2) * 26}px"` : '';
  const value = u.type === 'ordered' ? ` value="${u.num}"` : '';
  const cb = u.type === 'task' ? `<button class="cb" data-act="toggle" data-line="${u.start}" aria-label="${u.done ? '标为未完成' : '标为完成'}">${CHECK}</button>` : '';
  let body;
  if (act && S.cand === 'A') body = `<div class="ew c"><pre class="hl"></pre><textarea rows="1" spellcheck="false" data-edit="A">${esc(u.content)}</textarea></div>`;
  else if (act && S.cand === 'D') body = `<textarea class="srcbox" rows="1" spellcheck="false" data-edit="D">${esc(unitSource(u))}</textarea>`;
  else body = `<span class="c"${CE()} data-ce="${u.start}">${inline(u.content) || (S.cand === 'B' ? '' : '&#8203;')}</span>`;
  if (act && S.cand === 'D') return `<li class="${cls.replace('done', '')}"${style}${value} data-u="${u.start}">${body}</li>`;
  return `<li class="${cls}"${style}${value} data-u="${u.start}">${cb}${body}</li>`;
}

function renderUnit(u) {
  const act = isActive(u);
  if (act && S.cand === 'D') {
    return `<div data-prose="${u.type === 'code' ? 'object' : u.type === 'heading' ? 'h' + u.level : 'text'}" data-u="${u.start}"><textarea class="srcbox" rows="1" spellcheck="false" data-edit="D">${esc(unitSource(u))}</textarea></div>`;
  }
  if (u.type === 'heading') {
    const inner = act ? `<div class="ew"><pre class="hl"></pre><textarea rows="1" spellcheck="false" data-edit="A">${esc(unitSource(u))}</textarea></div>` : inline(u.content);
    return `<div class="h${u.level} u ${act ? 'act' : ''}" data-prose="h${u.level}" data-u="${u.start}"${act ? '' : CE()} data-ce="${u.start}">${inner}</div>`;
  }
  if (u.type === 'para') {
    const inner = act ? `<div class="ew"><pre class="hl"></pre><textarea rows="1" spellcheck="false" data-edit="A">${esc(unitSource(u))}</textarea></div>` : inline(u.content);
    return `<p class="p u ${act ? 'act' : ''}" data-prose="text" data-u="${u.start}"${act ? '' : CE()} data-ce="${u.start}">${inner}</p>`;
  }
  if (u.type === 'quote') {
    const inner = act ? `<div class="ew"><pre class="hl"></pre><textarea rows="1" spellcheck="false" data-edit="A">${esc(unitSource(u))}</textarea></div>` : `<p class="p"${CE()} data-ce="${u.start}">${inline(u.content)}</p>`;
    return `<blockquote class="quote u ${act ? 'act' : ''}" data-prose="text" data-u="${u.start}">${inner}</blockquote>`;
  }
  if (u.type === 'code') {
    const eave = `<div class="eave"><span>${esc(u.lang)}</span><span class="sp"></span><span>复制</span></div>`;
    if (act) return `<div class="blk u act" data-prose="object" data-u="${u.start}">${eave}<div class="ew mono"><pre class="hl"></pre><textarea rows="1" spellcheck="false" wrap="off" data-edit="A" data-fenced="1">${esc(u.body)}</textarea></div></div>`;
    return `<div class="blk u" data-prose="object" data-u="${u.start}">${eave}<pre${S.cand === 'B' ? ' contenteditable="plaintext-only" spellcheck="false"' : ''} data-ce="${u.start}">${esc(u.body)}</pre></div>`;
  }
}

function syncEditors() {
  docEl.querySelectorAll('textarea[data-edit]').forEach(ta => { mirror(ta); autosize(ta); });
}
function mirror(ta) {
  const pre = ta.parentElement.querySelector('pre.hl'); if (!pre) return;
  pre.innerHTML = hlBlock(ta.value, ta.dataset.fenced === '1') || '&#8203;';
}
function autosize(ta) {
  if (ta.classList.contains('srcbox')) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
}
function applyFocus(req) {
  let el;
  if (req.kind === 'edit') el = docEl.querySelector('textarea[data-edit]');
  else if (req.kind === 'ce') el = docEl.querySelector(`[data-ce="${req.start}"]`);
  if (!el) return;
  el.focus();
  if (el.tagName === 'TEXTAREA') {
    const pos = req.caret === 'start' ? 0 : typeof req.caret === 'number' ? req.caret : el.value.length;
    el.setSelectionRange(pos, pos);
  } else {
    const r = document.createRange(); r.selectNodeContents(el); r.collapse(req.caret === 'start');
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
}

/* ── 原文面板:改过的行变绿 ─────────────────────────── */
function renderRaw() {
  const pool = new Map();
  ORIGINAL.split('\n').forEach(l => pool.set(l, (pool.get(l) || 0) + 1));
  const src = S.cand === 'C' && S.sourceMode ? S.srcDraft : S.src;
  let n = 0;
  const html = src.split('\n').map((l, i) => {
    const c = pool.get(l) || 0; let chg = false;
    if (c > 0) pool.set(l, c - 1); else { chg = true; n++; }
    return `<div class="rl ${chg ? 'chg' : ''}"><span class="n">${i + 1}</span><span>${esc(l) || ' '}</span></div>`;
  }).join('');
  document.getElementById('raw').innerHTML = html;
  document.getElementById('chgcount').textContent = n ? `改动 ${n} 行` : '未改动';
}

/* ── A / D:单元编辑 ────────────────────────────────── */
function unitAt(start) { return parse(lines()).find(u => u.start === start); }
function unitsList() { return parse(lines()); }
function linesForEdit(u, value) {
  if (S.cand === 'D') return value.split('\n');
  if (isList(u)) return [prefixOf(u) + value.replace(/\n/g, ' ')];
  if (u.type === 'code') return ['```' + (u.lang === 'text' ? '' : u.lang), ...value.split('\n'), '```'];
  return value.split('\n');
}
function commitActive(opts = {}) {
  if (!S.active) return;
  const ta = docEl.querySelector('textarea[data-edit]');
  const u = unitAt(S.active.start);
  if (ta && u && !opts.discard) {
    const L = lines();
    L.splice(u.start, u.end - u.start + 1, ...linesForEdit(u, ta.value));
    setLines(L);
  }
  S.active = null;
}
function activate(start, caret) {
  S.active = { start };
  guard(() => render({ kind: 'edit', caret }));
}
let busy = false;
function guard(fn) { busy = true; try { fn(); } finally { busy = false; } }

docEl.addEventListener('focusout', e => {
  if (busy) return;
  const t = e.target;
  if (t.matches && t.matches('textarea[data-edit]')) {
    const to = e.relatedTarget;
    if (to && docEl.contains(to) && to.closest('[data-act="toggle"]')) return; // 点勾选框时交给 click
    guard(() => { commitActive(); render(); });
  }
  if (S.cand === 'B' && t.matches && t.matches('[data-ce]')) {
    const next = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-ce]');
    commitWys(t);
    const req = next ? { kind: 'ce', start: +next.dataset.ce, caret: 'end' } : null;
    guard(() => render(req));
  }
});

docEl.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('textarea[data-edit]')) { mirror(t); autosize(t); }
  if (t.matches('textarea[data-full]')) { S.srcDraft = t.value; mirror(t); renderRaw(); }
  if (S.cand === 'B' && t.matches('[data-ce]')) wysShortcut(t);
});

docEl.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches('textarea[data-full]')) {
    if (e.key === 'Escape') { S.sourceMode = false; render(); }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); S.src = S.srcDraft; S.sourceMode = false; render(); }
    return;
  }
  if (t.matches('textarea[data-edit]')) return editKeys(e, t);
  if (S.cand === 'B' && t.matches('[data-ce]')) return wysKeys(e, t);
});

function editKeys(e, ta) {
  const u = unitAt(S.active.start); if (!u) return;
  const pos = ta.selectionStart, end = ta.selectionEnd, v = ta.value;
  const all = unitsList(); const idx = all.findIndex(x => x.start === u.start);
  if (e.key === 'Escape') { e.preventDefault(); guard(() => { commitActive({ discard: true }); render(); }); return; }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); guard(() => { commitActive(); render(); }); return; }
  if (isList(u) && e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    const pfx = S.cand === 'D' ? (v.match(/^(\s*[-*+]\s+\[[ xX]\]\s?|\s*[-*+]\s+|\s*\d+\.\s+)/) || [''])[0] : '';
    const content = S.cand === 'D' ? v.slice(pfx.length) : v;
    if (!content.trim()) { // 空项再按回车:结束列表
      const L = lines(); L.splice(u.start, 1); setLines(L); S.active = null; guard(() => render()); return;
    }
    const before = v.slice(0, pos), after = v.slice(end);
    const L = lines();
    const head = S.cand === 'D' ? before : prefixOf(u) + before;
    const ind = ' '.repeat(u.indent || 0);
    const nextPfx = u.type === 'task' ? `${ind}${u.bullet} [ ] ` : u.type === 'bullet' ? `${ind}${u.bullet} ` : `${ind}${u.num + 1}. `;
    L.splice(u.start, 1, head, nextPfx + after.replace(/^\s+/, ''));
    setLines(L);
    S.active = null;
    activate(u.start + 1, S.cand === 'D' ? nextPfx.length : 'start');
    return;
  }
  if (e.key === 'Backspace' && pos === 0 && end === 0) {
    const empty = S.cand === 'D' ? !v.trim() : !v;
    if (empty && idx >= 0) {
      e.preventDefault();
      const L = lines(); L.splice(u.start, u.end - u.start + 1); setLines(L); S.active = null;
      const prev = all[idx - 1];
      if (prev) activate(prev.start < u.start ? prev.start : prev.start - 1, 'end'); else guard(() => render());
      return;
    }
  }
  if (isList(u) && e.key === 'Tab') {
    e.preventDefault();
    const L = lines();
    const cur = L[u.start];
    const ta2 = docEl.querySelector('textarea[data-edit]');
    // 先把正在改的字落回这一行,再动缩进
    L.splice(u.start, 1, ...linesForEdit(u, ta2.value));
    L[u.start] = e.shiftKey ? L[u.start].replace(/^ {1,2}/, '') : '  ' + L[u.start];
    const delta = L[u.start].length - cur.length;
    setLines(L); S.active = null;
    activate(u.start, S.cand === 'D' ? Math.max(0, pos + (e.shiftKey ? -Math.min(2, cur.length - cur.trimStart().length) : 2)) : pos);
    return;
  }
  if (e.key === 'ArrowUp' && pos === 0 && idx > 0) { e.preventDefault(); const p = all[idx - 1].start; guard(() => commitActive()); activate(p, 'end'); return; }
  if (e.key === 'ArrowDown' && pos === v.length && idx < all.length - 1) {
    e.preventDefault();
    const before = lines().length; guard(() => commitActive());
    const shift = lines().length - before;
    activate(all[idx + 1].start + shift, 'start'); return;
  }
}

/* ── B:所见即所得 ──────────────────────────────────── */
function serialize(node) {
  let s = '';
  node.childNodes.forEach(n => {
    if (n.nodeType === 3) { s += n.nodeValue.replace(/​/g, ''); return; }
    if (n.nodeType !== 1) return;
    const tag = n.tagName;
    if (tag === 'BR') { s += '\n'; return; }
    if (tag === 'STRONG' || tag === 'B') { s += `**${serialize(n)}**`; return; }
    if (tag === 'EM' || tag === 'I') { s += `*${serialize(n)}*`; return; }
    if (tag === 'DEL' || tag === 'S') { s += `~~${serialize(n)}~~`; return; }
    if (tag === 'CODE') { s += '`' + n.textContent + '`'; return; }
    if (tag === 'A') { s += `[${serialize(n)}](${n.dataset.href || n.getAttribute('href') || ''})`; return; }
    if (tag === 'DIV' || tag === 'P') { s += (s && !s.endsWith('\n') ? '\n' : '') + serialize(n); return; }
    s += serialize(n);
  });
  return s;
}
/** 写回:只在字真的变了时才重写这一块 —— 重写时按标准写法(这就是右边原文会看到的差别)。 */
function commitWys(el) {
  const u = unitAt(+el.dataset.ce); if (!u) return;
  let next;
  if (u.type === 'code') {
    const body = el.textContent.replace(/\n$/, '');
    if (body === u.body) return;
    next = ['```' + (u.lang === 'text' ? '' : u.lang), ...body.split('\n'), '```'];
  } else {
    const md = serialize(el).replace(/\n+$/, '');
    if (md === u.content) return;
    if (inline(md) === inline(u.content)) return; // 渲染结果一样 = 没改
    const ind = ' '.repeat(u.indent || 0);
    if (u.type === 'task') next = [`${ind}- [${u.done ? 'x' : ' '}] ${md}`];
    else if (u.type === 'bullet') next = [`${ind}- ${md}`];
    else if (u.type === 'ordered') next = [`${ind}${u.num}. ${md}`];
    else if (u.type === 'heading') next = ['#'.repeat(u.level) + ' ' + md];
    else if (u.type === 'quote') next = md.split('\n').map(l => '> ' + l);
    else next = md.split('\n');
  }
  const L = lines(); L.splice(u.start, u.end - u.start + 1, ...next); setLines(L);
}
function wysShortcut(el) {
  const u = unitAt(+el.dataset.ce); if (!u) return;
  const text = el.textContent;
  let line = null;
  if (u.type === 'para') {
    if (/^\[\]\s/.test(text)) line = '- [ ] ' + text.slice(3);
    else if (/^- \[ \]\s/.test(text) || /^#{1,3}\s/.test(text) || /^- /.test(text) || /^\d+\.\s/.test(text) || /^>\s/.test(text)) line = text;
  } else if (u.type === 'bullet' && /^\[\]\s/.test(text)) {
    line = ' '.repeat(u.indent) + '- [ ] ' + text.slice(3);
  }
  if (line === null) return;
  const L = lines(); L.splice(u.start, u.end - u.start + 1, line.replace(/ /g, ' ')); setLines(L);
  guard(() => render({ kind: 'ce', start: u.start, caret: 'end' }));
}
function wysKeys(e, el) {
  const u = unitAt(+el.dataset.ce); if (!u) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); document.execCommand('bold'); return; }
  if (mod && e.key.toLowerCase() === 'i') { e.preventDefault(); document.execCommand('italic'); return; }
  if (mod && e.key.toLowerCase() === 'e') {
    e.preventDefault();
    const sel = getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
    const r = sel.getRangeAt(0); const code = document.createElement('code'); code.className = 'ic';
    code.textContent = r.toString(); r.deleteContents(); r.insertNode(code); return;
  }
  if (e.key === 'Escape') { el.blur(); return; }
  if (u.type === 'code') return;
  if (e.key === 'Enter' && !e.isComposing) {
    if (!isList(u)) { e.preventDefault(); if (u.type === 'heading') el.blur(); else document.execCommand('insertLineBreak'); return; }
    e.preventDefault();
    const sel = getSelection(); const r = sel.getRangeAt(0);
    const pre = document.createRange(); pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
    const post = document.createRange(); post.selectNodeContents(el); post.setStart(r.endContainer, r.endOffset);
    const box = f => { const d = document.createElement('div'); d.appendChild(f); return serialize(d); };
    const before = box(pre.cloneContents()), after = box(post.cloneContents());
    const L = lines(); const ind = ' '.repeat(u.indent || 0);
    if (!el.textContent.replace(/​/g, '').trim()) { L.splice(u.start, 1); setLines(L); guard(() => render()); return; }
    const head = u.type === 'task' ? `${ind}- [${u.done ? 'x' : ' '}] ` : u.type === 'bullet' ? `${ind}- ` : `${ind}${u.num}. `;
    const nextPfx = u.type === 'task' ? `${ind}- [ ] ` : u.type === 'bullet' ? `${ind}- ` : `${ind}${u.num + 1}. `;
    L.splice(u.start, 1, head + before, nextPfx + after); setLines(L);
    guard(() => render({ kind: 'ce', start: u.start + 1, caret: 'start' }));
    return;
  }
  if (e.key === 'Backspace' && isList(u) && !el.textContent.replace(/​/g, '')) {
    e.preventDefault();
    const all = unitsList(); const idx = all.findIndex(x => x.start === u.start);
    const L = lines(); L.splice(u.start, 1); setLines(L);
    const prev = all[idx - 1];
    guard(() => render(prev ? { kind: 'ce', start: prev.start, caret: 'end' } : null));
  }
}
docEl.addEventListener('paste', e => {
  if (S.cand !== 'B' || !e.target.closest('[data-ce]')) return;
  e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
});

/* ── 点击 ───────────────────────────────────────────── */
document.addEventListener('mousedown', e => {
  // 点勾选框时不要让正在编辑的框先失焦重绘(那会把按钮换掉)
  if (e.target.closest('[data-act="toggle"]')) e.preventDefault();
});
document.addEventListener('click', e => {
  const c = e.target.closest('[data-cand]');
  if (c) { guard(() => { commitActive(); }); S.cand = c.dataset.cand; S.sourceMode = false; render(); return; }
  const w = e.target.closest('[data-width]');
  if (w) { S.width = w.dataset.width; render(); return; }
  if (e.target.closest('a.lk')) { e.preventDefault(); }
  const a = e.target.closest('[data-act]');
  if (a) {
    const act = a.dataset.act;
    if (act === 'toggle') {
      const active = S.active ? { ...S.active } : null;
      const ta = docEl.querySelector('textarea[data-edit]');
      const caret = ta ? ta.selectionStart : undefined;
      if (active) { guard(() => commitActive()); }
      const i = +a.dataset.line; const L = lines();
      L[i] = L[i].replace(/\[( |x|X)\]/, m => m === '[ ]' ? '[x]' : '[ ]'); setLines(L);
      if (active) activate(active.start, caret); else render();
      return;
    }
    if (act === 'add') {
      guard(() => commitActive());
      const L = lines(); let at = -1;
      parse(L).forEach(u => { if (u.type === 'task') at = u.end; });
      at = at >= 0 ? at + 1 : L.length;
      L.splice(at, 0, '- [ ] '); setLines(L);
      if (S.cand === 'B') guard(() => render({ kind: 'ce', start: at, caret: 'end' })); else activate(at, 'end');
      return;
    }
    if (act === 'reset') { reset(); render(); return; }
    if (act === 'src') { S.sourceMode = true; S.srcDraft = S.src; render(); return; }
    if (act === 'src-cancel') { S.sourceMode = false; render(); return; }
    if (act === 'src-done') { S.src = S.srcDraft; S.sourceMode = false; render(); return; }
  }
  if ((S.cand === 'A' || S.cand === 'D') && docEl.contains(e.target)) {
    const unit = e.target.closest('[data-u]');
    if (!unit || e.target.closest('textarea')) return;
    const start = +unit.dataset.u;
    if (S.active && S.active.start === start) return;
    const hadActive = !!S.active;
    let shift = 0;
    if (hadActive) { const before = lines().length; const prevStart = S.active.start; guard(() => commitActive()); if (prevStart < start) shift = lines().length - before; }
    activate(start + shift, 'end');
  }
});

render();
</script>
</body>
</html>
